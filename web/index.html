<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>board1 (web)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0F1115;
    --panel: #171A21;
    --border: #262B36;
    --text: #E6E8EC;
    --muted: #8B93A7;
    --accent: #2563EB;
    --ok: #22C55E;
    --err: #EF4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 32px 16px 64px;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .field {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  input[type="file"] {
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  .filename {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button:disabled {
    background: #33384A;
    color: var(--muted);
    cursor: not-allowed;
  }
  #result {
    margin-top: 20px;
  }
  .msg {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .msg.err { background: rgba(239,68,68,0.12); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
  .msg.ok { background: rgba(34,197,94,0.12); color: #86EFAC; border: 1px solid rgba(34,197,94,0.3); }
  .rows {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .page { color: var(--muted); flex-shrink: 0; }
  .row.applied .page { color: var(--ok); }
  .row.failed .page { color: var(--err); }
  a.download {
    display: block;
    text-align: center;
    margin-top: 16px;
    background: var(--ok);
    color: #06210F;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>
<main>
  <h1>board1 (web)</h1>
  <p class="sub">대본 TXT("Np" 페이지 표시)를 PPT 슬라이드 메모에 입력합니다. Windows/Mac 상관없이 브라우저에서 동작하며, 파일은 서버로 전송되지 않고 이 브라우저 안에서만 처리됩니다.</p>

  <div class="field">
    <label>PPTX 파일</label>
    <input type="file" id="pptxInput" accept=".pptx" />
    <div class="filename" id="pptxName">선택된 파일 없음</div>
  </div>

  <div class="field">
    <label>대본 TXT 파일</label>
    <input type="file" id="txtInput" accept=".txt" />
    <div class="filename" id="txtName">선택된 파일 없음</div>
  </div>

  <button id="runBtn" disabled>메모 입력 실행</button>

  <div id="result"></div>
</main>

<script type="module">
  import init, { importNotes } from "./pkg/board1_web.js";

  const pptxInput = document.getElementById("pptxInput");
  const txtInput = document.getElementById("txtInput");
  const pptxName = document.getElementById("pptxName");
  const txtName = document.getElementById("txtName");
  const runBtn = document.getElementById("runBtn");
  const result = document.getElementById("result");

  let wasmReady = false;
  init().then(() => { wasmReady = true; updateButton(); });

  function updateButton() {
    runBtn.disabled = !(wasmReady && pptxInput.files[0] && txtInput.files[0]);
  }

  pptxInput.addEventListener("change", () => {
    pptxName.textContent = pptxInput.files[0]?.name ?? "선택된 파일 없음";
    updateButton();
  });
  txtInput.addEventListener("change", () => {
    txtName.textContent = txtInput.files[0]?.name ?? "선택된 파일 없음";
    updateButton();
  });

  function readAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsArrayBuffer(file);
    });
  }

  function readAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file, "utf-8");
    });
  }

  runBtn.addEventListener("click", async () => {
    result.innerHTML = "";
    runBtn.disabled = true;
    runBtn.textContent = "처리 중...";
    try {
      const pptxFile = pptxInput.files[0];
      const txtFile = txtInput.files[0];
      const pptxBytes = new Uint8Array(await readAsArrayBuffer(pptxFile));
      const scriptText = await readAsText(txtFile);

      const res = importNotes(pptxBytes, scriptText);
      const summary = JSON.parse(res.summaryJson);

      const rows = document.createElement("div");
      rows.className = "rows";
      for (const item of summary.applied) {
        const row = document.createElement("div");
        row.className = "row applied";
        row.innerHTML = `<span>${escapeHtml(item.message)}</span><span class="page">p.${item.page}</span>`;
        rows.appendChild(row);
      }
      for (const item of summary.failed) {
        const row = document.createElement("div");
        row.className = "row failed";
        row.innerHTML = `<span>${escapeHtml(item.message)}</span><span class="page">p.${item.page}</span>`;
        rows.appendChild(row);
      }
      result.appendChild(rows);

      const blob = new Blob([res.bytes], {
        type: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
      });
      const url = URL.createObjectURL(blob);
      const outName = pptxFile.name.replace(/\.pptx$/i, "") + "_notes.pptx";
      const a = document.createElement("a");
      a.className = "download";
      a.href = url;
      a.download = outName;
      a.textContent = `결과 다운로드 (${outName})`;
      result.appendChild(a);
    } catch (e) {
      const msg = document.createElement("div");
      msg.className = "msg err";
      msg.textContent = typeof e === "string" ? e : (e?.message ?? String(e));
      result.appendChild(msg);
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "메모 입력 실행";
      updateButton();
    }
  });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
